<title>Process Trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f4f6f8; --grid:#e3e8ec; --border:#cfd7de;
  --text:#16202a; --text-dim:#51606e; --text-faint:#85919c;
  --accent:#1f5f99; --accent-tint:#e5eef7;
  --risk:#b3261e; --risk-bg:#fbeceb; --info:#1f5f99; --info-bg:#e8f0f8;
  --mix-base:#ffffff;
  --shadow:0 1px 2px rgba(18,28,40,.06),0 4px 14px rgba(18,28,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1216; --surface:#151b21; --surface-2:#1a2129; --grid:#232c35; --border:#2d3843;
    --text:#e4e9ee; --text-dim:#a0acb8; --text-faint:#6d7985;
    --accent:#6ea8dc; --accent-tint:#16283a;
    --risk:#ff8a80; --risk-bg:#3a1a19; --info:#8cbde8; --info-bg:#15263a;
    --mix-base:#151b21;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1216; --surface:#151b21; --surface-2:#1a2129; --grid:#232c35; --border:#2d3843;
  --text:#e4e9ee; --text-dim:#a0acb8; --text-faint:#6d7985;
  --accent:#6ea8dc; --accent-tint:#16283a;
  --risk:#ff8a80; --risk-bg:#3a1a19; --info:#8cbde8; --info-bg:#15263a;
  --mix-base:#151b21;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
code{font-size:.92em;background:var(--surface-2);border:1px solid var(--grid);border-radius:4px;padding:0 4px}
.shell{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow:auto;padding-bottom:8px}
.brand{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:700;font-size:20px;letter-spacing:.01em;margin:0}
.brand small{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:12px;color:var(--text-faint);letter-spacing:0;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.panel h3{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:600}
label.fld{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px}
select{width:100%;padding:7px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:13px}
select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;flex-direction:column;gap:2px}
.keybtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:4px 6px;font:inherit;font-size:12.5px;color:var(--text);cursor:pointer}
.keybtn:hover{background:var(--surface-2)}
.keybtn[aria-pressed="true"]{border-color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,var(--mix-base))}
.sw{width:12px;height:12px;border-radius:3px;background:var(--kc);flex:none}
.keybtn .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-faint)}
.inspector .none{color:var(--text-faint);font-size:12.5px}
.inspector .val{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;padding:2px 8px;border-radius:5px;display:inline-block;background:color-mix(in srgb,var(--kc) 22%,var(--mix-base));border-left:3px solid var(--kc)}
.inspector ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.inspector li button{background:none;border:0;padding:3px 0;font:inherit;font-size:12.5px;color:var(--accent);cursor:pointer;text-align:left}
.inspector li button:hover{text-decoration:underline}
.inspector li span{color:var(--text-faint);font-family:"IBM Plex Mono",monospace;font-size:11px;margin-left:4px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.tog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);cursor:pointer;margin-top:6px}
.tog input{accent-color:var(--accent);margin:0}

main{min-width:0;display:flex;flex-direction:column;gap:20px}
.hero h1{margin:0;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:28px;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
.hero .sub{color:var(--text-dim);margin:2px 0 10px;font-size:14px}
.hero p{margin:0;max-width:80ch;color:var(--text)}
.meta{font-size:12px;color:var(--text-faint);margin-top:10px}
.meta b{color:var(--text-dim);font-weight:600}
.story{background:var(--accent-tint);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--mix-base));border-radius:10px;padding:10px 14px;font-size:13.5px;max-width:100ch}
.story b{font-weight:600}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fstep{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative}
.fstep:hover{border-color:var(--accent)}
.fstep .no{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-faint)}
.fstep .tt{font-weight:600;font-size:13.5px;line-height:1.3}
.fstep .who{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent)}
.fstep .tbls{display:flex;flex-wrap:wrap;gap:4px}
.fstep .tbls span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:var(--surface-2);border:1px solid var(--grid);border-radius:4px;padding:0 5px;color:var(--text-dim)}
.fstep .tbls span.empty{opacity:.45;text-decoration:line-through}

section.step{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.stephead{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;border-top:2px solid var(--text);padding-top:10px}
.stepno{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--text);grid-row:span 3}
.stephead h2{margin:0;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:21px;font-weight:600;text-wrap:balance}
.stephead .who{font-size:12.5px;color:var(--text-dim)}
.stephead .who code{color:var(--accent)}
.stephead p{margin:2px 0 0;max-width:95ch;font-size:13.5px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:16px}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.cardhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--grid)}
.cardhead .tn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13.5px}
.cardhead .role{color:var(--text-dim);font-size:12.5px}
.cardhead .rc{margin-left:auto;font-size:11.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.empty-note{padding:12px 14px;color:var(--text-faint);font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;color:var(--text-dim);padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th.k{box-shadow:inset 0 -3px 0 var(--kc)}
th.num,td.num{text-align:right}
td{padding:4px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:top}
td.txt{white-space:normal;min-width:180px;max-width:360px}
td.null{color:var(--text-faint);font-style:italic}
td.num{font-family:"IBM Plex Mono",monospace;font-size:12px}
td.kc{padding:3px 6px}
.kv{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--kc) 20%,var(--mix-base));border-left:3px solid var(--kc);cursor:pointer;color:var(--text);line-height:1.6}
.kv:hover,.kv.hot{background:color-mix(in srgb,var(--kc) 45%,var(--mix-base));outline:2px solid var(--kc);outline-offset:0}
.kv.pin{outline:2px solid var(--text);background:color-mix(in srgb,var(--kc) 55%,var(--mix-base))}
body.focusing .kv:not(.hot):not(.pin){opacity:.35}
body.famfocus .kv:not(.fam){opacity:.3}
tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--border)}
tfoot td.lbl{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--text-dim)}

.matrix .tw table{font-size:12px}
.matrix td.hit{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:color-mix(in srgb,var(--kc) 16%,var(--mix-base))}
.matrix td.miss{color:var(--grid)}
.matrix th.kh{text-align:center;box-shadow:inset 0 -3px 0 var(--kc)}
.matrix td.step{font-family:"IBM Plex Mono",monospace;color:var(--text-faint)}

.findings{display:flex;flex-direction:column;gap:10px}
.finding{border-radius:10px;padding:10px 14px;border:1px solid;max-width:110ch}
.finding.risk{background:var(--risk-bg);border-color:color-mix(in srgb,var(--risk) 40%,var(--mix-base))}
.finding.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 35%,var(--mix-base))}
.finding .lv{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.finding.risk .lv{color:var(--risk)} .finding.info .lv{color:var(--info)}
.finding h4{margin:2px 0 4px;font-size:14px}
.finding p{margin:0;font-size:13px}
h2.sec{margin:8px 0 0;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:21px;font-weight:600;border-top:2px solid var(--text);padding-top:10px}
.secnote{margin:0;color:var(--text-dim);font-size:13px;max-width:95ch}
footer{font-size:12px;color:var(--text-faint);max-width:100ch}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:static;max-height:none}
}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}}
</style>

<div class="shell">
  <aside>
    <p class="brand">Process Trace<small>CORECS ERP · follow one transaction through every table it touches</small></p>
    <div class="panel">
      <label class="fld" for="modSel">Module</label>
      <select id="modSel"></select>
      <label class="fld" for="scSel" style="margin-top:10px">Sample transaction</label>
      <select id="scSel"></select>
      <label class="tog"><input type="checkbox" id="compact">Key and amount columns only</label>
    </div>
    <div class="panel">
      <h3>Linking keys</h3>
      <div class="keys" id="keys"></div>
      <div class="btnrow"><button class="btn" id="clearFam" type="button">Show all keys</button></div>
    </div>
    <div class="panel inspector" id="inspector">
      <h3>Selected value</h3>
      <div id="insBody"><p class="none">Click any colored value to pin it and list every table and column where it appears.</p></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>

    { "id": "dev",    "label": "Delivery no.",      "color": "#0ea5e9", "note": "DeliveryNo from sp_GetDeliveryNumber, allocated when Process Sales Order opens. Scopes the delivery lines and the FIFO rows." },

    { "id": "prod",   "label": "Product",           "color": "#64748b", "note": "ProductCode. DeliveryDetails / InventoryDeliveryFIFO call it ProductNo; Inventory calls it Product." },
    { "id": "line",   "label": "Delivery line",     "color": "#ec4899", "note": "DeliveryDetails.SeqNo within the delivery. InventoryDeliveryFIFO.DevDetSeqNo points back to the scan line that consumed the lot." },
    { "id": "lot",    "label": "Inventory lot",     "color": "#f97316", "note": "Inventory.SequenceNumber. InventoryDeliveryFIFO.SequenceReferenceNumber and InventoryLedger.SequenceRefNum record which lot was deducted or restored." },
    { "id": "ticket", "label": "GL ticket",         "color": "#ef6f5e", "note": "TicketNumber of the SI ticket posted by sp_PostCompoundTicketSales. ClientLedger.TicketReference points back to it." },

    "posAppr": { "table": "PurchaseOrderSummary", "role": "Order status now", "keys": { "PONumber": "po" }, "mask": ["ApprovedBy"] },

    "dd":      { "table": "DeliveryDetails", "role": "Delivery lines (one per scan / weigh)", "keys": { "DeliveryNo": "dev", "PONumber": "po", "ReferenceNumber": "drref", "SeqNo": "line", "ProductNo": "prod" }, "qty": ["QtyDelivered", "ActualQty", "Variance"], "money": ["Cost", "SellingPrice"], "mask": ["ProcessedBy"] },

    "hist":    { "table": "HistoryLogs", "role": "Audit line written by Save", "keys": {}, "mask": ["UserID"], "empty": "No history line." },

    { "n": 3, "title": "Order is processed and stock goes out", "who": "sp_AddBranchOrderHRI_JFC → sp_FiFoMappingHRI_JFC → sp_SalesQtyToInventoryQtyHRI_JFC, then sp_ConfirmBranchOrder", "where": "View Branch Order › Process Sales Order (AddBranchOrder)",
      "what": "Opening the order allocates the delivery number and reference. Each scan checks stock in the chosen shipment, deducts it oldest SequenceNumber first (UPDLOCK), writes one InventoryDeliveryFIFO and one InventoryLedger row per lot, and adds a PENDING DeliveryDetails line. Cancelling a line (sp_CancelDeliveryFIFOJFC) restores the lot, flags the FIFO row isErrorCorrect = 1 and the line isCancelled = 1. Save (sp_ConfirmBranchOrder) copies the FIFO cost onto each line, sets the delivery FOR DELIVERY, sets PurchaseOrderSummary.isProcess = 1 and logs it.",

  "scenarios": [
    { "id": "clean-vat-mix", "title": "3 products, VAT and VAT-exempt, no cancellations", "ids": "9496",
      "story": "Three ordered products processed as four delivery lines, each drawing on its own lot. Because the order mixes VAT and VAT-exempt items, confirm posts two tickets (SI-VAT and SI-VATEX) for the one invoice." },
    { "id": "cancel-rescan", "title": "Scanned lines cancelled and re-scanned", "ids": "7375",
      "story": "All three products were scanned (lines 1–3, delivery reference 17421), cancelled, and scanned again after the order was reopened (lines 4–6, new reference 17425, same delivery number). Follow a lot key: the ledger shows the deduction, the cancel restore (STS CANCEL ITEM) and the second deduction. The cancelled lines and their FIFO rows stay behind with isCancelled / isErrorCorrect = 1, and only lines 4–6 reach the sale." }
  ],
  "findings": [
    { "level": "risk", "title": "Cancelling a line restores only one lot",
      "text": "sp_CancelDeliveryFIFOJFC reads a single InventoryDeliveryFIFO row for the line (DevDetSeqNo) and puts that quantity back on that one lot. When a scan was bigger than the oldest lot and spilled into a second lot, the second lot's deduction is never restored and its FIFO row stays active, although the line is marked cancelled. The stock is lost from Inventory with no sale behind it." },
    { "level": "risk", "title": "Approval, reject and invoice-number updates are string-built SQL",
      "text": "POForApprovalDetails and ViewForDeliveryDetails concatenate the typed Remarks and invoice number straight into UPDATE statements. An apostrophe in the remarks breaks the update, and any text typed there runs as SQL. These should move to parameterized commands (CLAUDE.md rule 2)." },
    { "level": "info", "title": "Confirm overwrites the approval date; auto-approval leaves no approver",
      "text": "sp_ConfirmOrder runs UPDATE PurchaseOrderSummary SET Status = 'DELIVERED', DateApproved = GETDATE(), so the approval date is lost once an order is confirmed: on COREX001, 6,792 of the 6,796 delivered orders since August show a DateApproved later than their effectivity date. With AddSalesOrder on auto-approval, ApprovedBy is blank on every order, so nothing records who approved, or when. Rejects done from the Orders for Approval list only set Status, so the 298 rejected orders have no rejecter either." },
    { "level": "info", "title": "Sales-order stock moves are labelled as STS in the inventory ledger",
      "text": "The JFC deduction and cancel procs were copied from the STS transfer flow, so InventoryLedger.Remarks reads 'STS IN-TRANSIT PO#-…' and 'STS CANCEL ITEM PO#…' for sales orders too, and DestinationBranch is the ordering branch. A ledger report can't tell a client sale from a branch transfer except by the PO number. This trace matches the rows on that remark text." },
    { "level": "info", "title": "Stock leaves at processing, the sale is booked at confirm",
      "text": "Inventory is reduced on every scan in step 3, but cost of sales and AR are only posted in step 5. An order that is processed but never confirmed keeps its stock deducted with no sales ticket; the inventory sits in DeliveryDetails / InventoryDeliveryFIFO as FOR DELIVERY." },
    { "level": "info", "title": "Invoice uniqueness is checked against deliveries only",
      "text": "Print Delivery Receipt only checks DeliverySummary for a duplicate invoice number. A number already used by a balance-forward invoice in TransactionChargeSales would be accepted, and AR Payment matches invoices on InvoiceNo + PO + customer, so it wouldn't mix them up, but reports that key on InvoiceNo alone would." }
  ]

  "id": "ar-payment",
  "order": 2,
  "title": "AR Payment",
  "subtitle": "Client payment: invoice → payment capture → posting → reversal",
  "form": "AccountingDevEx/ClientPaymentsDevExAcctg.cs",
  "idLabel": "PaymentHeaderID",
  "sql": "ARPayment.sql",
  "summary": "A charge invoice is created when a sales order is confirmed. Accounting then records the client's payment in Client Payments: the form writes the payment header, the payment-method row and one ARPaymentDetails row per invoice and deduction type, then calls sp_AddPaymentClient in the same transaction. The proc settles the invoices, books the GL ticket from JournalEntryMapping, credits the client ledger and adds a deposit-in-transit line to bank recon. sp_ReversePaymentClient undoes all of it with mirrored entries.",
  "keys": [
    { "id": "cust",   "label": "Customer",          "color": "#f59e0b", "note": "CustomerKey (char 8). ClientLedger calls it AccountKey / AccountID; the cheque and online rows store it in CustomerID." },
    { "id": "po",     "label": "Sales order (PO)",  "color": "#22c55e", "note": "The sales order number. TransactionChargeSales.ReferenceNo = ARPaymentDetails.PONumber = sales ticket ReferenceNumber." },
    { "id": "inv",    "label": "Invoice",           "color": "#eab308", "note": "InvoiceNo. Always paired with the PO: sp_AddPaymentClient matches invoices on InvoiceNo + ReferenceNo/PONumber + CustomerKey." },
    { "id": "ref",    "label": "Payment reference", "color": "#06b6d4", "note": "PaymentHeader.ReferenceNo from sp_GetReferenceNumber. Becomes the ticket's ReferenceNumber/ReferenceKey, the ledger's ReferenceNumber/ORNumber and the bank recon SourceRef." },
    { "id": "phid",   "label": "PaymentHeaderID",   "color": "#3b82f6", "note": "Identity of PaymentHeader. Links the payment-method row and every ARPaymentDetails row." },
    { "id": "ctrl",   "label": "Control no.",       "color": "#d946ef", "note": "Typed by the user on the form; copied to the cheque/online row." },
    { "id": "cr",     "label": "CR no.",            "color": "#8b5cf6", "note": "Collection receipt number, typed by the user." },
    { "id": "ticket", "label": "GL ticket",         "color": "#ef6f5e", "note": "TicketNumber from GetTicketNumber. ClientLedger.TicketReference points back to it." },
    { "id": "mnem",   "label": "Mnemonic",          "color": "#84cc16", "note": "Chosen by sp_AddPaymentClient from the deduction mix (OR-COLL, OR-EWT, OR-DISC-OVERPAY, …). Selects the JournalEntryMapping rows and becomes the ledger TransCode." },
    { "id": "acct",   "label": "GL account",        "color": "#14b8a6", "note": "AccountCode. The bank/cash account entered on the form (DebitGLCode) replaces the {BANK} token in JournalEntryMapping." }

    { "n": 1, "title": "Sales invoice is created", "who": "sp_ConfirmOrder", "where": "Orders › Confirm sales order",
      "what": "Writes the invoice and its lines, posts the SI-VAT / SI-VATEX ticket through sp_PostCompoundTicketSales, which also debits the client ledger. The ticket's ReferenceNumber is the PO and its ReferenceKey is the invoice.",
      "tables": ["tcs", "tcsd", "salesTm", "salesTd", "salesCl"] },
    { "n": 2, "title": "Payment is captured", "who": "ClientPaymentsDevExAcctg (C#, one SqlTransaction)", "where": "Accounting › Client Payments › Submit",
      "what": "InsertPaymentHeader gets the reference number and returns the new PaymentHeaderID. InsertPaymentMethod writes the cheque, online or cash row. InsertARPaymentDetails writes INVOICE PAYMENT at gross plus one row each for EWT, DISCOUNT, OFFSET, OVERPAY, OVERPAYINCOME and SERVICES.",
      "tables": ["ph", "cheque", "online", "cash", "arpd"] },
    { "n": 3, "title": "Payment is posted", "who": "sp_AddPaymentClient @PaymentHeaderID", "where": "Called by the form before commit",
      "what": "Sums ARPaymentDetails by type, picks the mnemonic, loads its JournalEntryMapping legs ({BANK} = DebitGLCode), checks DR = CR, then updates each invoice's AmountPaid / EWT / Discount / Offset / Balance / PayStatus, writes the ticket, one ClientLedger credit per invoice, and a DIT line in BankStatementRecon. The ledger trigger recomputes ClientAccounts.",
      "tables": ["jem", "tcsAfter", "payTm", "payTd", "payCl", "bsr", "ca"] },
    { "n": 4, "title": "Payment is reversed", "who": "sp_ReversePaymentClient", "where": "Client Payments › Posted › Reverse",
      "what": "Backs the amounts out of each invoice, sets ARPaymentDetails.ErrorTag = 1, copies every ticket with ReferenceNumber = the payment reference with DR/CR swapped, mirrors the ledger rows, marks PaymentHeader REVERSED, flags the payment-method row and resolves the DIT line.",
      "tables": ["revTm", "revTd", "revCl"] }

  "findings": [
    { "level": "risk", "title": "Reversal matches tickets and ledger rows on the reference number alone",
      "text": "sp_ReversePaymentClient copies every TicketMaster/TicketDetails row WHERE ReferenceNumber = the payment reference, and every ClientLedger row with that ReferenceNumber. Sales tickets carry the PO number in the same column, and PO numbers and payment references come from different counters. On COREX001, 34 payments share their reference with another ticket; 31 of them are still POSTED, so reversing one would also mirror an unrelated customer's sales ticket and ledger row. The 3 reversed ones ran before the colliding sales ticket existed. Suggested fix: filter by Mnemonic LIKE 'OR-%' (tickets) and AccountKey = the customer + TransCode LIKE 'OR-%' (ledger)." },
    { "level": "info", "title": "ARPaymentDetails.TicketNumber stays blank",
      "text": "The form inserts '' and the proc never fills it. The ticket is reachable through ClientLedger.TicketReference or TicketMaster.ReferenceNumber = the payment reference." }
  ]

,"404","OTHER INCOME",0.0000,17500.0000],["14614","888","30862","30862","101020111","CASH IN BANK - PNB PESO",120919.4000,0.0000],["14614","888","30862","30862","101030101","ACCOUNTS RECEIVABLE - TRADE",0.0000,103419.4000],["14614","888","30862","30862","20115","CUSTOMER ADVANCES / OVERPAYMENTS",0.0000,17500.0000]]},"payCl":{"c":["AccountKey","TRN_SEQ_NO","PostingDate","TransCode","ReferenceNumber","ORNumber","InvoiceNo","BeginningBalance","Debit","Credit","EndingBalance","TicketReference"],"r":[["00001897",28,"2026-08-01","OR-OVERPAY","29671","29671","C-047418",596304.3500,0.0000,39529.4000,556774.9500,"13696"],["00001897",29,"2026-08-01","OR-OVERPAY","29671","29671","C-047988",556774.9500,0.0000,20490.0000,536284.9500,"13696"],["00001897",30,"2026-08-01","OR-OVERPAY","29671","29671","C-048095",536284.9500,0.0000,37400.0000,498884.9500,"13696"],["00001897",31,"2026-08-01","OR-OVERPAY","29671","29671","C-048111",498884.9500,0.0000,6000.0000,492884.9500,"13696"],["00001897",37,"2026-08-01","OR-OVERPAY","30862","30862","C-047418",521850.7500,0.0000,39529.4000,482321.3500,"14614"],["00001897",38,"2026-08-01","OR-OVERPAY","30862","30862","C-047988",482321.3500,0.0000,20490.0000,461831.3500,"14614"],["00001897",39,"2026-08-01","OR-OVERPAY","30862","30862","C-048095",461831.3500,0.0000,37400.0000,424431.3500,"14614"],["00001897",40,"2026-08-01","OR-OVERPAY","30862","30862","C-048111",424431.3500,0.0000,6000.0000,418431.3500,"14614"]]},"bsr":{"c":["ReconID","HeaderID","BranchCode","AccountCode","PeriodEnd","ItemType","ItemDate","Payee","ReferenceNo","Amount","SourceModule","SourceRef","IsResolved","ResolvedReason"],"r":[[1491,1144,"888","101020111","2026-08-31","DIT","2026-08-01","CLIENT COLLECTION - Customer B","29671",120919.40,"AR-PAYMENT","29671",true,"REVERSED"],[2080,1144,"888","101020111","2026-08-31","DIT","2026-08-01","CLIENT COLLECTION - Customer B","30862",120919.40,"AR-PAYMENT","30862",false,""]]},"ca":{"c":["AccountKey","AccountID","AccountName","AccountStatus","AccountBalance","CashWalletBalance"],"r":[["00001897","00001897","Customer B","Active",132896.25,0.00]]},"revTm":{"c":["TicketDate","BranchCode","TicketNumber","ReferenceNumber","ReferenceKey","Particulars","Status","EnteredBy","Product"],"r":[["2026-08-01","888","13883","29671","29671","REVERSAL: OR-OVERPAY ENTRY","REVERSED","User 2","REVERSAL of 29671"]]},"revTd":{"c":["TicketNumber","ReferenceNumber","AccountCode","AccountName","Debit","Credit"],"r":[["13883","29671","101030101","ACCOUNTS RECEIVABLE - TRADE",103419.4000,0.0000],["13883","29671","404","OTHER INCOME",17500.0000,0.0000],["13883","29671","101020111","CASH IN BANK - PNB PESO",0.0000,120919.4000]]},"revCl":{"c":["AccountKey","TRN_SEQ_NO","PostingDate","TransCode","ReferenceNumber","InvoiceNo","Debit","Credit","EndingBalance","TicketReference","Remarks"],"r":[["00001897",32,"2026-09-23 13:26","OR-OVERPAY","29671","C-047418",39529.4000,0.0000,532414.3500,"13883","REVERSAL ENTRY"],["00001897",33,"2026-09-23 13:26","OR-OVERPAY","29671","C-047988",20490.0000,0.0000,552904.3500,"13883","REVERSAL ENTRY"],["00001897",34,"2026-09-23 13:26","OR-OVERPAY","29671","C-048095",37400.0000,0.0000,590304.3500,"13883","REVERSAL ENTRY"],["00001897",35,"2026-09-23 13:26","OR-OVERPAY","29671","C-048111",6000.0000,0.0000,596304.3500,"13883","REVERSAL ENTRY"]]}}}},{"def":{
  "id": "supplier-payment",
  "order": 3,
  "title": "Supplier Payment",
  "subtitle": "Expense payable → voucher → GL, ledger and balances → reversal",
  "form": "AccountingDevEx/AddExpenseDevExFrm.cs → AccountingDevEx/SupplierPaymentDevEx.cs → AccountingDevEx/SupplierVoucherReversalFrm.cs",
  "idLabel": "Voucher",
  "maskLabel": "Supplier",
  "sql": "SupplierPayment.sql",
  "summary": "A payable is created when an expense is posted: single-branch expenses through Add Expense (spu_PostExpenseV2, PostingMode SINGLE), multi-branch ones through Expense Manual Multi-Branch (MULTI-MANUAL). Supplier Payment lists the supplier's open invoices (splist_Accounts). Submit takes a payment reference and a voucher number, then sp_PostSupplierPaymentWithManualLines calls sp_AddPaymentSupplierCompound_V2. Per invoice, V2 locks and re-reads the balance, settles it, posts a settlement ticket (one per branch share for multi-branch), writes the payment lines and a supplier-ledger debit; then one bank-recon line for the net cash and the cheque, cash or telegraphic voucher. Overpayments become supplier credit that a later voucher can apply. Supplier Voucher Reversal undoes a voucher with mirrored tickets and ledger rows.",
  "keys": [
    { "id": "sup",     "label": "Supplier",          "color": "#f59e0b", "note": "Supplier.SupplierID. ExpenseSummary / ExpenseMaster store it in SupplierID, TransactionPaymentAP and CheckVoucherCancelled in SupplierKey, SupplierLedger in both. On COREX001 SupplierKey = SupplierID for every supplier." },
    { "id": "expref",  "label": "Expense reference", "color": "#22c55e", "note": "ReferenceNumber of the expense posting (ExpenseSummary / ExpenseMaster / its ticket / its ledger row). Balance-forward invoices loaded at go-live carry reference 1." },
    { "id": "batch",   "label": "Expense batch",     "color": "#0ea5e9", "note": "BatchReferenceID: with SupplierID + InvoiceNo, the key V2 uses to find and lock the invoice being paid. APPaymentDetails also stores it as SequenceReferenceNumber." },
    { "id": "inv",     "label": "Invoice",           "color": "#eab308", "note": "The supplier's invoice number. The expense ticket stores it in ReferenceKey." },
    { "id": "branch",  "label": "Branch",            "color": "#64748b", "note": "Which branch carries the expense line, ticket and payment share. A multi-branch invoice is paid per branch share, one ticket each." },
    { "id": "ref",     "label": "Payment reference", "color": "#06b6d4", "note": "ReferenceNumber from sp_GetReferenceNumber at Submit. Ties the voucher, payment lines, tickets, ledger rows, bank recon (SourceRef) and reversal audit together." },
    { "id": "voucher", "label": "Voucher no.",       "color": "#3b82f6", "note": "VoucherID from sp_GetVoucherNumber. The payment ticket stores it in ReferenceKey, the bank recon line in ReferenceNo." },
    { "id": "ticket",  "label": "GL ticket",         "color": "#ef6f5e", "note": "TicketNumber. APPaymentDetails.TicketNumber and SupplierLedger.TicketReference point back to it." },
    { "id": "mnem",    "label": "Mnemonic",          "color": "#84cc16", "note": "SINGLE / EXP-MANUAL-CROSS-BR on expense tickets, SINGLE-PAY (single-branch) or EXP-ACCRUAL-PAY (multi-branch share) on payment tickets, PV-AP-* rows in JournalEntryMapping for overpay and advance accounts." },
    { "id": "acct",    "label": "GL account",        "color": "#14b8a6", "note": "AccountCode. The bank account picked on the form is the voucher CreditGLCode, the payment line CreditGLCode, the ticket's credit leg and the bank recon AccountCode; the payable account (usually 20103) is the debit leg." }
  ],
  "tables": {
    "es":      { "table": "ExpenseSummary", "role": "Payable (one per invoice)", "keys": { "SupplierID": "sup", "ReferenceNumber": "expref", "InvoiceNo": "inv", "BatchReferenceID": "batch", "PayableAccountCode": "acct" }, "money": ["Amount"], "mask": ["AddedBy"] },
    "em":      { "table": "ExpenseMaster", "role": "Expense lines (debit legs, per branch)", "keys": { "SupplierID": "sup", "ReferenceNumber": "expref", "InvoiceNo": "inv", "BatchReferenceID": "batch", "BranchCode": "branch", "TicketReference": "ticket" }, "money": ["Amount", "Balance", "AmountPaid"], "total": true },
    "expTm":   { "table": "TicketMaster", "role": "Expense GL ticket (header)", "keys": { "TicketNumber": "ticket", "ReferenceNumber": "expref", "ReferenceKey": "inv", "BranchCode": "branch", "Mnemonic": "mnem" }, "mask": ["Owner", "EnteredBy"], "empty": "No expense ticket: balance-forward invoices were loaded at go-live without one." },
    "expTd":   { "table": "TicketDetails", "role": "Expense GL ticket (lines)", "keys": { "TicketNumber": "ticket", "ReferenceNumber": "expref", "ReferenceKey": "inv", "BranchCode": "branch", "AccountCode": "acct" }, "money": ["Debit", "Credit"], "lookup": ["AccountName"], "total": true, "empty": "No expense ticket lines." },
    "expSl":   { "table": "SupplierLedger", "role": "Supplier ledger: payable credit", "keys": { "SupplierID": "sup", "ReferenceNumber": "expref", "InvoiceNo": "inv", "BatchReferenceID": "batch", "TicketReference": "ticket" }, "money": ["BeginningBalance", "Debit", "Credit", "EndingBalance"] },

    "tpap":    { "table": "TransactionPaymentAP", "role": "Payment header (per supplier)", "keys": { "SupplierKey": "sup", "ReferenceNumber": "ref" }, "money": ["Amount"], "mask": ["ExecuteBy"] },
    "cv":      { "table": "CheckVoucher", "role": "Voucher: cheque", "keys": { "VoucherID": "voucher", "SupplierID": "sup", "ReferenceNumber": "ref", "CreditGLCode": "acct" }, "money": ["Amount"], "mask": ["PaidTo", "PreparedBy", "CancelledBy"], "empty": "Not a cheque voucher." },
    "cashv":   { "table": "CashVoucher", "role": "Voucher: cash", "keys": { "VoucherID": "voucher", "SupplierID": "sup", "ReferenceNumber": "ref", "CreditGLCode": "acct" }, "money": ["Amount"], "mask": ["PaidTo", "PreparedBy"], "empty": "Not a cash voucher." },
    "tv":      { "table": "TelegraphicVoucher", "role": "Voucher: telegraphic transfer", "keys": { "VoucherID": "voucher", "SupplierID": "sup", "ReferenceNumber": "ref", "CreditGLCode": "acct" }, "money": ["Amount"], "mask": ["PaidTo", "PreparedBy"], "empty": "Not a telegraphic voucher." },
    "apd":     { "table": "APPaymentDetails", "role": "Payment lines (per invoice / branch share / type)", "keys": { "VoucherID": "voucher", "SupplierID": "sup", "ReferenceNumber": "ref", "BranchCode": "branch", "InvoiceNo": "inv", "BatchReferenceID": "batch", "DebitGLCode": "acct", "CreditGLCode": "acct", "TicketNumber": "ticket" }, "money": ["Amount"], "total": "PaymentType" },
    "credit":  { "table": "APPaymentDetails", "role": "Supplier credit pool (OVERPAY − ADVANCEAPPLIED)", "keys": { "SupplierID": "sup", "VoucherID": "voucher", "ReferenceNumber": "ref", "InvoiceNo": "inv" }, "money": ["Amount"], "empty": "This supplier has no overpayment or advance lines." },

    "jem":     { "table": "JournalEntryMapping", "role": "Config: overpay / advance account", "keys": { "Mnemonic": "mnem", "AccountCode": "acct" }, "empty": "No overpay or advance on these vouchers, so no mapping row is read." },
    "payTm":   { "table": "TicketMaster", "role": "Payment GL ticket (header)", "keys": { "TicketNumber": "ticket", "ReferenceNumber": "ref", "ReferenceKey": "voucher", "BranchCode": "branch", "Mnemonic": "mnem" }, "mask": ["Owner", "EnteredBy"] },
    "payTd":   { "table": "TicketDetails", "role": "Payment GL ticket (lines)", "keys": { "TicketNumber": "ticket", "ReferenceNumber": "ref", "ReferenceKey": "voucher", "BranchCode": "branch", "AccountCode": "acct" }, "money": ["Debit", "Credit"], "lookup": ["AccountName"], "total": true },
    "paySl":   { "table": "SupplierLedger", "role": "Supplier ledger: payment debit", "keys": { "SupplierID": "sup", "ReferenceNumber": "ref", "InvoiceNo": "inv", "BatchReferenceID": "batch", "TicketReference": "ticket" }, "money": ["BeginningBalance", "Debit", "Credit", "EndingBalance"] },
    "esAfter": { "table": "ExpenseSummary", "role": "Payable balances now", "keys": { "SupplierID": "sup", "InvoiceNo": "inv", "BatchReferenceID": "batch" }, "money": ["Amount", "AmountPaid", "EWTWithheld", "DiscountWithheld", "OffsetWithheld", "Balance"], "mask": ["UpdatedBy"] },
    "bsr":     { "table": "BankStatementRecon", "role": "Bank recon: outstanding cheque / payment", "keys": { "BranchCode": "branch", "AccountCode": "acct", "ReferenceNo": "voucher", "SourceRef": "ref" }, "money": ["Amount"], "empty": "No bank recon line." },
    "sa":      { "table": "SupplierAccounts", "role": "Supplier account balance now", "keys": { "SupplierKey": "sup", "SupplierID": "sup" }, "money": ["AccountBalance"], "mask": ["SupplierName"] },

    "pra":     { "table": "PaymentReversalAudit", "role": "Reversal audit", "keys": { "VoucherID": "voucher", "SupplierID": "sup", "ReferenceNumber": "ref" }, "mask": ["CancelledBy"], "empty": "Not reversed." },
    "cvc":     { "table": "CheckVoucherCancelled", "role": "Cancelled cheque copy", "keys": { "VoucherID": "voucher", "SupplierKey": "sup", "ReferenceNumber": "ref" }, "money": ["Amount"], "mask": ["PaidTo", "ExecuteBy"], "empty": "No cancelled-cheque copy (not reversed, or not a cheque voucher)." },
    "revTm":   { "table": "TicketMaster", "role": "Reversal GL ticket (header)", "keys": { "TicketNumber": "ticket", "ReferenceNumber": "ref", "ReferenceKey": "voucher", "BranchCode": "branch", "Mnemonic": "mnem" }, "mask": ["EnteredBy"], "empty": "Not reversed." },
    "revTd":   { "table": "TicketDetails", "role": "Reversal GL ticket (lines, DR/CR swapped)", "keys": { "TicketNumber": "ticket", "ReferenceNumber": "ref", "ReferenceKey": "voucher", "AccountCode": "acct" }, "money": ["Debit", "Credit"], "lookup": ["AccountName"], "total": true, "empty": "Not reversed." },
    "revSl":   { "table": "SupplierLedger", "role": "Supplier ledger: reversal credit", "keys": { "SupplierID": "sup", "ReferenceNumber": "ref", "InvoiceNo": "inv", "TicketReference": "ticket" }, "money": ["Debit", "Credit", "EndingBalance"], "empty": "Not reversed." }
  },
  "steps": [
    { "n": 1, "title": "Expense is posted (the payable)", "who": "spu_PostExpenseV2 (SINGLE) · sp_PostExpenseManualMultiBranch (MULTI-MANUAL)", "where": "Accounting › Add Expense · Expense Manual Multi-Branch",
      "what": "Writes the payable to ExpenseSummary (Balance = what lands on the payable account), one ExpenseMaster row per debit line, the expense ticket and a supplier-ledger credit. For a PO-linked expense it also adds the inventory leg to Inventory.Cost (see the Item Costing Recon). Balance-forward invoices loaded at go-live have only the ExpenseSummary / ExpenseMaster / ledger rows.",
      "tables": ["es", "em", "expTm", "expTd", "expSl"] },
    { "n": 2, "title": "Voucher and payment lines are written", "who": "sp_PostSupplierPaymentWithManualLines → sp_AddPaymentSupplierCompound_V2", "where": "Accounting › Supplier Payment › Submit",
      "what": "The form sends the ticked invoices as dbo.AP_PaymentLineTVP (plus OverPay / Advance in dbo.AP_PaymentLineExtraTVP, and any manual debit lines). V2 writes the payment header, checks advance credit under an app lock (APCREDIT:supplier), then per invoice writes an EXPENSE PAYMENT line at gross and an OVERPAY / OVERPAYEXPENSE / ADVANCEAPPLIED line when used. Last, sp_Payment_CreateVoucherHeader writes the cheque, cash or telegraphic voucher for the net cash. The credit pool is the supplier's OVERPAY minus ADVANCEAPPLIED, skipping reversed vouchers.",
      "tables": ["tpap", "cv", "cashv", "tv", "apd", "credit"] },
    { "n": 3, "title": "GL, ledger and balances are updated", "who": "sp_AddPaymentSupplierCompound_V2 → sp_Payment_PostSettlementTicket, sp_Payment_PostBankReconEntry", "where": "Same transaction as step 2",
      "what": "Per invoice (per branch share for multi-branch): reduce ExpenseSummary.Balance and set PARTIAL / FULLYPAID, settle ExpenseMaster, post the settlement ticket (DR payable, CR bank, CR EWT / discount, DR/CR the overpay or advance account from JournalEntryMapping) and debit the supplier ledger. After the loop, one OC bank-recon line for the total net cash. The ledger trigger recomputes SupplierAccounts.",
      "tables": ["jem", "payTm", "payTd", "paySl", "esAfter", "bsr", "sa"] },
    { "n": 4, "title": "Voucher is reversed", "who": "sp_ReverseCombinedSupplierVoucher → sp_CancelledChequesCS → sp_ReverseTicketsAP, sp_BankRecon_VoidOC", "where": "Accounting › Supplier Voucher Reversal",
      "what": "Refuses a voucher whose overpayment credit a later voucher already used (60519). Flags the voucher, writes the audit row and a cancelled-cheque copy, restores each invoice's balance, tags the ledger rows and adds mirror credits, copies each payment ticket with DR/CR swapped (Product = REVERSAL), and resolves the bank-recon line as VOIDED. The wrapper then flags the cash / telegraphic voucher too.",
      "tables": ["pra", "cvc", "revTm", "revTd", "revSl"] }
  ],
  "scenarios": [
    { "id": "single-cheque", "title": "Cheque paying one single-branch expense", "ids": "686",
      "story": "A Cagayan petty-cash replenishment posted through Add Expense (4 expense lines, one SINGLE ticket), paid in full by one cheque. Follow the batch and invoice keys from the payable to the payment line, then the payment reference and voucher number through the ticket, ledger and bank recon." },
    { "id": "multi-branch", "title": "Multi-branch expense: one invoice, three branch shares", "ids": "688",
      "story": "A Cebu petty-cash replenishment split across branches 002, 013 and 888. Payment writes one payment line and one settlement ticket per branch share, with one voucher and one bank-recon line for the total. Note the expense side: all three branch tickets share ticket number 7239." },
    { "id": "overpay-advance", "title": "Overpayment credit applied, reversed, applied again", "ids": "735,736,737",
      "story": "Voucher 735 settles two invoices and overpays one by 2.00 (OVERPAY, carried as supplier credit). Voucher 736 applies that 2.00 to the next invoice (ADVANCEAPPLIED) and was later reversed as a wrong entry, which returned the credit; voucher 737 then applied it to the same invoice again. The credit pool table shows the running story." },
    { "id": "cash-reversed", "title": "Cash voucher reversed", "ids": "628",
      "story": "A cash voucher paying a customs expense, reversed the next day for a wrong date. The cash voucher has no cancelled-cheque copy; it is flagged by the reversal wrapper instead of by sp_CancelledChequesCS." }
  ],
  "findings": [
    { "level": "risk", "title": "Single expenses' ledger rows point to a ticket that doesn't exist",
      "text": "spu_PostExpenseV2 posts the expense ticket under the @TicketNumber the form passed in, but writes SupplierLedger.TicketReference from a second, new GetTicketNumber call. On COREX001 all 379 SNGLE ledger rows reference a ticket number that has no TicketMaster row, and every expense burns one ticket number. Fix: use @TicketNumber for TicketReference and drop the extra GetTicketNumber call." },
    { "level": "risk", "title": "Invoice payment and manual debit lines aren't one transaction",
      "text": "sp_PostSupplierPaymentWithManualLines calls V2 (which commits) and then sp_PostCashAdvance. If the manual lines fail, the invoice payment stays posted; the proc's own error message tells the user not to re-run it. The final voucher-amount and bank-recon corrections are also outside any transaction." },
    { "level": "risk", "title": "The 'already reversed' guard only looks at CheckVoucher",
      "text": "sp_CancelledChequesCS refuses a second reversal only when CheckVoucher.isErrorCorrect = 1. For cash and telegraphic vouchers the flag is set afterwards by sp_ReverseCombinedSupplierVoucher, which itself has no transaction. A second call for a cash or telegraphic voucher (or a failure between the two procs) would pass the guard and reverse it again. Guard on PaymentReversalAudit instead, and wrap the wrapper in a transaction." },
    { "level": "info", "title": "Multi-branch expense tickets share one ticket number",
      "text": "sp_PostExpenseManualMultiBranch gets one ticket number before its branch loop, so every branch's ticket header carries the same TicketNumber (7239 in the multi-branch sample), while sp_EditExpenseManualMultiBranch and the payment side use one number per branch. Already in the work log as an open question." },
    { "level": "info", "title": "Reversal tickets look like normal payment tickets",
      "text": "sp_ReverseTicketsAP copies the original Status (POSTED) and Mnemonic; only Product = 'REVERSAL' and the '(REVERSAL)' prefix in Particulars mark them. A report that filters tickets by Mnemonic sees both and nets them to zero, which is right, but one that lists POSTED payment tickets will show the reversal as a payment." },
    { "level": "info", "title": "Column names don't say which supplier key they hold",
      "text": "V2 matches ExpenseSummary.SupplierID against Supplier.SupplierKey, while APPaymentDetails.SupplierID and the reversal procs use Supplier.SupplierID, and PaymentReversalAudit.VoucherType holds the pay method (EXPENSE / PURCHASE), not CHECK / CASH. On COREX001 SupplierKey = SupplierID for all 138 suppliers, so nothing breaks today; a supplier created with different values would stop matching." },
    { "level": "info", "title": "Not traced yet: PURCHASE mode",
      "text": "Paying PO purchases (APAccounts, PV-AP mnemonics through sp_PostCompoundTicket) is a separate branch of V2. COREX001 has only 3 such vouchers; it can be added as its own sample once there's a representative one." }
  ]

(function(){

  // column classification

  function cell(tid, col, v){

  function occurrences(f, v){

    return out;
  }
